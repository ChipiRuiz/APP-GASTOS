async function push(){
  if(!sb||!user)return;
  const at=new Date().toISOString();
  const {error}=await sb.from('app_state').upsert({user_id:user.id,data:S,updated_at:at});
  if(error){setSync('sin conexión · se guarda al volver');console.warn(error);return}
  remoteAt=at;pending=false;cache();setSync('guardado');
}
async function pull(force){
  const {data,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(data&&(force||!remoteAt||data.updated_at>remoteAt)){S=data.data;remoteAt=data.updated_at;cache();return true}
  return false;
}

async function boot(){
  try{const c=JSON.parse(localStorage.getItem(cacheKey()));if(c){S=c.S;remoteAt=c.remoteAt}}catch(e){}
  applyTheme();render();

}
async function start(){
  applyTheme(SAK);
  if(!sb){$('#app').innerHTML='<div class="banner">No se pudo cargar la conexión. Revisá internet y recargá.</div>';return}
  const recovering=/type=recovery/.test(location.hash);
  if(/error_code=|error=/.test(location.hash)){history.replaceState(null,'',appURL());return showForgot('El link venció o ya se usó. Pedí uno nuevo.')}
  let shown=false;
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'&&!shown){shown=true;showNewPass()}});
  const {data}=await sb.auth.getSession();
  if(recovering||shown){if(!shown){shown=true;showNewPass()}return}
  if(data.session){user=data.session.user;await boot()}else showLogin();
}

function ensureMonth(m){
  if(S.months[m])return S.months[m];
  const prev=Object.keys(S.months).filter(k=>k<m).sort().pop();
  const p=prev?S.months[prev]:{usd:0,salary:0,taxes:[]};
  S.months[m]={usd:p.usd,salary:p.salary,taxes:p.taxes.map(t=>({...t,id:uid(),paid:false}))};
  save();return S.months[m];
}
const lastMonth=m=>{const k=Object.keys(S.months).filter(x=>x<=m&&S.months[x]).sort().pop();return k?S.months[k]:{usd:0,salary:0,taxes:[]}};
const rate=m=>(S.months[m]&&S.months[m].usd)||(lastMonth(m).usd||0);
const plainDep=m=>S.deposits.find(x=>x.month===m&&!x.note);
const savingOf=m=>{const d=plainDep(m);return d?+d.amount:0};
function setSaving(m,v){let d=plainDep(m);if(!v){if(d)S.deposits=S.deposits.filter(x=>x!==d);return}if(d)d.amount=v;else{S.deposits.push({id:uid(),month:m,amount:v,note:''});S.deposits.sort((a,b)=>a.month.localeCompare(b.month))}}
function migrate(){let ch=false;
  if(!S.cards){S.cards=DEF_CARDS.map(c=>({...c,close:(S.close&&S.close[c.id])||c.close}));delete S.close;ch=true}for(const[m,M]of Object.entries(S.months||{})){if('saving'in M){if(M.saving&&!plainDep(m))setSaving(m,M.saving);delete M.saving;ch=true}}return ch}
function cardTot(c,m){const L=lines(c.id,m),A=L.filter(l=>!l.u),U=L.filter(l=>l.u);const b=sumBy(A,'val'),r=sumBy(A,'ref'),ub=sumBy(U,'uval'),ur=sumBy(U,'uref');return{c,L,b,r,n:b-r,ub,ur,un:ub-ur}}
function tcTotal(cs,M){const ars=cs.reduce((s,x)=>s+x.n,0),un=cs.reduce((s,x)=>s+x.un,0);return ars+Math.max(0,un-num(M.usdPaid||0))*(num(M.usd)||0)}
const incOf=m=>((S.months[m]||{}).incomes||[]).reduce((s,x)=>s+num(x.amount),0);
function monthTotals(m){const M=S.months[m]||lastMonth(m);const tc=tcTotal(cardsAll().map(c=>cardTot(c,m)),{usd:rate(m),usdPaid:(S.months[m]||{}).usdPaid||0});const tx=(M.taxes||[]).reduce((s,t)=>s+num(t.amount),0);const sal=num(M.salary),inc=incOf(m),sv=savingOf(m),owe=shOweMonth(m);return{sal,inc,tc:tc+owe,tx,sv,owe,rest:sal+inc-sv-tc-tx-owe}}
function lines(card,m){
  return S.purchases.filter(p=>p.card===card).map(p=>{
    let n=diffM(m,p.first)+1,cu=p.cuota;
    if(p.hist&&S.histEnd&&m<=S.histEnd){if(!(m in p.hist))return null;n=p.hist[m];cu=p.hc?.[m]??p.cuota}
    else if(p.rec){if(n<1||(p.until&&m>p.until))return null}else if(n<1||n>p.cuotas)return null;
    const u=p.cur==='USD',rt=u?rate(m):1,hasR=p.refunds&&(m in p.refunds),sh=!!p.shared&&!p.refAll&&!hasR&&(!p.shared.from||m>=p.shared.from),uref=p.refAll?cu:hasR?p.refunds[m]:sh?Math.round(cu*p.shared.s*100)/100:0;
    const val=cu*rt,ref=uref*rt;
    return{p,n,val,ref,net:val-ref,u,uval:u?cu:0,uref:u?uref:0,sh};
  }).filter(Boolean).sort((a,b)=>(a.p.date||'').localeCompare(b.p.date||'')||a.p.desc.localeCompare(b.p.desc));
}
function monday(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const dm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
function closeDate(c,m){if(!isCredit(c))return '';const[y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate();return String(Math.min(c.close||26,last)).padStart(2,'0')+'/'+String(mo).padStart(2,'0')}
function firstFor(card,iso){const day=+iso.slice(8,10),m=iso.slice(0,7),c=cardById(card);if(c&&!isCredit(c))return m;return day>((c||{}).close||26)?addM(m,1):m}
const sumBy=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const itemARS=i=>(+i.ars||0)+(+i.usd||0)*(+i.rate||0);

const tripSavAmt=t=>t.savAmt?+t.savAmt:tripTot(t);

const depDone=()=>S.deposits.filter(x=>x.month<curYM);
function loanIn(){const out=[];for(const L of SH.all||[])for(const x of L.loans||[]){if(x.kind!=='devolucion')continue;const P=(L.loans||[]).find(y=>y.id===x.loan_id);if(!P||P.lender!==user?.id)continue;
  const d=x.date||todayISO(),m=d.slice(0,7);out.push({id:x.id,date:d,month:m,amount:+x.amount*(x.cur==='USD'?rate(m):1),usd:x.cur==='USD'?+x.amount:0,who:shOtherOf(L)||'',descr:P.descr||'Préstamo'})}return out.sort((a,b)=>a.date.localeCompare(b.date))}
const loanInDone=()=>loanIn().filter(x=>x.date<=todayISO());
const savBal=()=>sumBy(depDone(),'amount')+sumBy(loanInDone(),'amount')-sumBy(S.savingsExp,'amount')-tripSav();

      <div class="fld"><label>Dólar del mes</label><input inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-mf="usd" value="${M.usd?nf(M.usd):''}" placeholder="0,00"></div>
      <div class="fld"><label>${m>curYM?'Ahorros proyectados':'Ahorros disponibles'}</label><div style="padding:9px 0;font-weight:650">${fmt(m===curYM?savBal():savAt(m))}</div></div>
    </div>

const CATPAL={l:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#0891b2','#84cc16','#c026d3','#a16207','#0f766e','#f43f5e','#6366f1','#ca8a04','#7c3aed','#b91c1c','#0369a1','#65a30d'],d:['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767','#22d3ee','#a3e635','#e879f9','#d4a056','#2dd4bf','#fb7185','#818cf8','#facc15','#c084fc','#f87171','#38bdf8','#86efac']};
let DON=[];
function catSlot(c){S.catSlots=S.catSlots||{};const m=S.catSlots;
  for(const k of Object.keys(m))if(!S.cats.includes(k))delete m[k];
  if(c in m)return m[c];if(!S.cats.includes(c))return -1;
  for(const k of S.cats){if(k in m)continue;const used=new Set(Object.values(m));let f=0;while(used.has(f))f++;if(f>=20)break;m[k]=f;if(k===c)break}
  return c in m?m[c]:-1}
function donutHTML(cat){
  const dark=!!window.__dark;
  const pal=CATPAL[dark?'d':'l'],other={k:'OTROS',v:0,c:'var(--muted)'};
  let seg=[];
  for(const[k,v]of Object.entries(cat)){if(v<=0)continue;const i=catSlot(k);if(i>=0)seg.push({k,v,c:pal[i],i:S.cats.indexOf(k)});else other.v+=v}
  seg.sort((a,b)=>a.i-b.i);if(other.v>0)seg.push(other);
  const tot=seg.reduce((s,x)=>s+x.v,0);if(!tot)return '<div class="mut">Sin gastos.</div>';
  const R=90,r0=58,cx=95,cy=95;let a0=-Math.PI/2;
  const pt=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)].map(n=>n.toFixed(2)).join(' ');
  DON=seg.map(x=>({...x,p:x.v/tot}));
  const paths=DON.map((x,j)=>{const a1=a0+x.p*Math.PI*2-(x.p===1?1e-4:0),lg=(a1-a0)>Math.PI?1:0;
    const d=`M${pt(a0,R)} A${R} ${R} 0 ${lg} 1 ${pt(a1,R)} L${pt(a1,r0)} A${r0} ${r0} 0 ${lg} 0 ${pt(a0,r0)}Z`;a0=a1;
    return `<path d="${d}" fill="${x.c}" data-dj="${j}"></path>`}).join('');
  return `<div class="donut" id="donut"><svg viewBox="0 0 190 190" role="img" aria-label="Gastos por categoría">${paths}
    <text x="95" y="80" text-anchor="middle" class="dc1" id="dc1">Total</text><text x="95" y="101" text-anchor="middle" class="dc2" id="dc2">${fmt(tot)}</text><text x="95" y="118" text-anchor="middle" class="dc3" id="dc3">${DON.length} categorías</text></svg>
    <div class="dleg">${DON.map((x,j)=>`<button data-dj="${j}"><i style="background:${x.c}"></i><span>${esc(x.k)}</span><b>${fmt(x.v)}</b><span class="pc">${(x.p*100).toFixed(0)}%</span></button>`).join('')}</div><div class="dtip" id="dtip"></div></div>`;
}
function donutHL(j,ev){
  const w=$('#donut');if(!w)return;const x=DON[j];
  w.classList.toggle('hl',j!=null);w.querySelectorAll('[data-dj]').forEach(e=>e.classList.toggle('on',+e.dataset.dj===j));
  $('#dc1').textContent=x?x.k:'Total';$('#dc2').textContent=fmt(x?x.v:DON.reduce((s,y)=>s+y.v,0));$('#dc3').textContent=x?(x.p*100).toFixed(1)+'% del mes':DON.length+' categorías';

    const [{data:lgs},{data:ms},{data:es},{data:lns}]=await Promise.all([
      sb.from('ledgers').select('*').in('id',ids),
      sb.from('ledger_members').select('*').in('ledger_id',ids),
      sb.from('ledger_entries').select('*').in('ledger_id',ids).order('first_month'),
      sb.from('ledger_loans').select('*').in('ledger_id',ids).order('date')]);

}

function sheet(html,onSave,onDel){
  $('#ov').innerHTML=`<div class="ov"><form class="sheet">${html}<div class="btns">${onDel?'<button type="button" class="btn del" data-x="del">Eliminar</button>':''}<button type="button" class="btn sec" data-x="cancel">Cancelar</button><button class="btn">Guardar</button></div></form></div>`;
  const f=$('#ov form');
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('.btn:not(.sec):not(.del)');if(b)b.disabled=true;const r=await onSave(Object.fromEntries(new FormData(f)),f);if(b)b.disabled=false;if(r!==false){close();save();render()}};
  f.querySelector('[data-x=cancel]').onclick=close;
  if(onDel)f.querySelector('[data-x=del]').onclick=async()=>{if(!confirm('¿Eliminar?'))return;if(onDel.constructor.name==='AsyncFunction'){if(await onDel()!==false)close();return}if(withUndo('Eliminado',onDel)!==false)close()};
  $('#ov .ov').onclick=e=>{if(e.target.classList.contains('ov'))close()};
  setTimeout(()=>f.querySelector('input:not([type=hidden]):not([type=radio])')?.focus(),50);
  return f;
}
const close=()=>{$('#ov').innerHTML=''};
let undoT=null;
function toast(msg,undo){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Deshacer</button>':''}`;t.className='on';clearTimeout(undoT);
  if(undo)t.querySelector('button').onclick=()=>{undo();t.className='';clearTimeout(undoT)};undoT=setTimeout(()=>t.className='',7000)}
function withUndo(msg,fn){const snap=JSON.stringify(S);if(fn()===false)return false;save();render();toast(msg,()=>{S=JSON.parse(snap);save();applyTheme();render();toast('Restaurado')})}
const fld=(l,inner,hint)=>`<div class="fld"><label>${l}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
const catSel=v=>`<select name="cat">${(S.cats.includes(v)||!v?S.cats:[...S.cats,v]).map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ Nueva categoría…</option></select>`;
const normCat=n=>n.trim().replace(/\s+/g,' ').toUpperCase();
function addCat(n){n=normCat(n);if(!n)return null;if(!S.cats.includes(n))S.cats.push(n);return n}
const curSeg=v=>`<div class="seg"><label><input type="radio" name="cur" value="ARS" ${v!=='USD'?'checked':''}><span>ARS</span></label><label><input type="radio" name="cur" value="USD" ${v==='USD'?'checked':''}><span>USD</span></label></div>`;

const shareLabel=(sh,cu)=>{const p=Math.round(sh*1000)/10;return [0,50,100].includes(p)||Number.isInteger(p)?p+'%':fmt(sh*cu)};
function splitUI(prefix,share,cuota,hint){
  const pct=Math.round(share*1000)/10,mode=hint==='monto'||hint==='pct'?hint:pct===50?'50':pct===100?'100':pct===0&&prefix==='sh'?'0':(Number.isInteger(pct)?'pct':'monto');
  const val=mode==='pct'?pct:mode==='monto'?nf(Math.round(share*cuota*100)/100):'';
  return `<div class="f2"><div class="fld"><label>Le toca al otro</label><select name="${prefix}mode">${[['50','50%'],['100','100%'],...(prefix==='sh'?[['0','0% (registro)']]:[]),['pct','Otro %'],['monto','Monto exacto']].map(([v,l])=>`<option value="${v}" ${v===mode?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="fld ${prefix}valw"><label class="${prefix}vall">${mode==='monto'?'Monto por cuota':'%'}</label><input name="${prefix}val" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${val}" placeholder="${mode==='monto'?'0,00':'Ej: 30'}"><div class="hint ${prefix}valh"></div></div></div>`;
}
function splitWire(f,prefix,getCuota){
  const md=f[prefix+'mode'],w=f.querySelector('.'+prefix+'valw');if(!md)return;
  const ui=()=>{const m=md.value;w.style.visibility=m==='pct'||m==='monto'?'visible':'hidden';f.querySelector('.'+prefix+'vall').textContent=m==='monto'?'Monto por cuota':'%';f[prefix+'val'].placeholder=m==='monto'?'0,00':'Ej: 30';
    const cu=getCuota(),sh=splitValue(f,prefix,cu);f.querySelector('.'+prefix+'valh').textContent=cu&&(m==='pct'||m==='monto')?(m==='monto'?`${Math.round(sh*1000)/10}% de la cuota`:`${fmt(sh*cu)} por cuota`):''};
  md.onchange=ui;f[prefix+'val'].oninput=ui;ui();return ui;
}
function splitValue(f,prefix,cu){const m=f[prefix+'mode']?.value,v=num(f[prefix+'val']?.value);
  if(m==='50')return .5;if(m==='100')return 1;if(m==='0')return 0;if(m==='pct')return Math.min(1,Math.max(0,v/100));if(m==='monto')return cu?Math.min(1,Math.max(0,v/cu)):0;return .5}
function syncShared(o,want,lid,share){
  const from=o.shared?.from||(o.first<view&&!o.rec?view:o.first),done=Math.max(0,diffM(from,o.first)),left=Math.max(1,o.cuotas-done);
  share=share==null?(o.shared?.s??.5):share;
  if(!sb||!user)return;
  const row={cur:o.cur==='USD'?'USD':'ARS',descr:o.desc,date:o.date||null,cuota:o.cuota,cuotas:o.rec?1:left,first_month:from,updated_at:new Date().toISOString()};
  if(want&&!o.shared&&lid){const L=SH.all.find(x=>x.ledger.id===lid);const w=L?shOtherOf(L):'';
    o.shared={l:lid,e:null,s:share,w,from};save();render();
    sb.from('ledger_entries').insert({...row,ledger_id:lid,paid_by:user.id,kind:'gasto',share,source_purchase:o.id}).select().then(({data,error})=>{
      if(error){delete o.shared;save();render();return alert('No se pudo cargar en compartido: '+error.message)}
      o.shared.e=data&&data[0]&&data[0].id;save();shLoad().then(()=>toast('También cargado en compartido'))})}
  else if(want&&o.shared&&o.shared.e){o.shared.s=share;sb.from('ledger_entries').update({...row,share}).eq('id',o.shared.e).then(()=>shLoad())}
  else if(!want&&o.shared){const e=o.shared.e;delete o.shared;save();render();if(e)sb.from('ledger_entries').delete().eq('id',e).then(()=>{shLoad();toast('Quitado de la cuenta compartida')})}
}

    <div class="f2 cardonly"><div class="creditonly">${fld('Cuotas',`<input name="cuotas" inputmode="numeric" value="${p.cuotas}">`)}</div>${fld('Categoría',catSel(p.cat))}</div>

    ${inMonth||isNew?`<div class="f2 cardonly">${fld(`<span id="reflbl">Reintegro en ${mLabel(isNew?(p.first||view):view)}</span>`,`<input name="ref" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${!isNew&&p.refunds?.[view]?nf(p.refunds[view]):''}" placeholder="0,00">`,'Devolución o descuento de esa cuota. Opcional.')}<div></div></div>`:''}

  const sync=()=>{const c=f.card.value,ah=c==='AHORRO',cr=isCredit(cardById(c));f.querySelectorAll('.cardonly').forEach(e=>e.style.display=ah?'none':'');f.querySelector('.creditonly').style.display=cr?'':'none';if(!cr)f.cuotas.value=1;$('#firstlbl').textContent=cr?'Primera cuota':'Mes';};
  const amtUI=()=>{const n=Math.max(1,parseInt(f.cuotas.value)||1),ah=f.card.value==='AHORRO',v=num(f.total.value),u=f.querySelector('[name=cur]:checked')?.value==='USD';
    $('#amtlbl').textContent=!ah&&n>1?'Valor de cada cuota':'Monto';
    $('#amthint').textContent=!ah&&n>1&&v?`Total: ${u?fmtU(v*n):fmt(v*n)} en ${n} cuotas`:''};
  f.cuotas.oninput=amtUI;f.total.oninput=amtUI;f.querySelectorAll('[name=cur]').forEach(x=>x.onchange=amtUI);
  const dsync=()=>{$('#dclr').style.visibility=f.date.value?'visible':'hidden'};$('#dclr').onclick=()=>{f.date.value='';dsync()};f.date.addEventListener('input',dsync);dsync();

  f.card.onchange=()=>{sync();amtUI();shBox()};f.date.onchange=sync;sync();amtUI();

  else if(a==='quick'){tab==='comp'&&SH.ledger?shEntryForm(null,'gasto'):purchaseForm()}

  else if(a==='lnedit')lnForm(SH.loans.find(x=>x.id===id));
  else if(a==='lnpay')lnPayForm(null,id);
  else if(a==='lnmore')lnPayForm(null,id,'adicional');

  else if(a==='edit')purchaseForm(S.purchases.find(p=>p.id===id));
  else if(a==='delnote'){withUndo('Comentario borrado',()=>{delete S.purchases.find(p=>p.id===id).note})}
  else if(a==='note'){const x=S.purchases.find(p=>p.id===id);sheet(`<h3>Comentario</h3><div class="hint" style="margin-bottom:8px">${esc(x.desc)}</div>${fld('',`<textarea name="note" rows="3" placeholder="Escribí un comentario breve">${esc(x.note||'')}</textarea>`)}`,d=>{const n=(d.note||'').trim();if(n)x.note=n;else delete x.note})}
  else if(a==='addcard'||a==='editcard')cardForm(a==='editcard'?cardById(id):null);
  else if(a==='paidtx'){const x=S.months[view].taxes.find(y=>y.id===id);x.paid=!x.paid;save();render()}
  else if(a==='addinc'){const M=S.months[view];(M.incomes=M.incomes||[]).push({id:uid(),name:'',amount:0});save();render();setTimeout(()=>{const e=[...document.querySelectorAll('[data-ic=name]')].pop();e&&e.focus()},30)}
  else if(a==='delinc'){withUndo('Ingreso eliminado',()=>{const M=S.months[view];M.incomes=M.incomes.filter(x=>x.id!==id)})}
  else if(a==='addtax'){S.months[view].taxes.push({id:uid(),name:'',amount:0,paid:false});save();render()}
  else if(a==='deltax'){withUndo('Servicio eliminado',()=>{const M=S.months[view];M.taxes=M.taxes.filter(x=>x.id!==id)})}
  else if(a==='adddep')simpleForm('Nuevo ahorro',[['month','Mes','month',curYM],['amount','Monto','num'],['note','Nota']],null,d=>{S.deposits.push({id:uid(),month:d.month,amount:num(d.amount),note:d.note})});
  else if(a==='editdep'){const x=S.deposits.find(y=>y.id===id);simpleForm('Editar ahorro',[['month','Mes','month',x.month],['amount','Monto','num',nf(x.amount)],['note','Nota','',x.note]],x,d=>{Object.assign(x,{month:d.month,amount:num(d.amount),note:d.note})},()=>{S.deposits=S.deposits.filter(y=>y!==x)})}
  else if(a==='addsx')simpleForm('Gasto desde ahorros',[['desc','Descripción'],['date','Fecha','date',todayISO()],['amount','Monto','num']],null,d=>{S.savingsExp.push({id:uid(),desc:d.desc,date:d.date,amount:num(d.amount)})});
  else if(a==='editsx'){const x=S.savingsExp.find(y=>y.id===id);simpleForm('Editar gasto desde ahorros',[['desc','Descripción','',x.desc],['date','Fecha','date',x.date],['amount','Monto','num',nf(x.amount)]],x,d=>{Object.assign(x,{desc:d.desc,date:d.date,amount:num(d.amount)})},()=>{S.savingsExp=S.savingsExp.filter(y=>y!==x)})}
  else if(a==='addtrip')sheet(`<h3>Nuevo viaje</h3>${fld('Nombre','<input name="name" required>')}<label class="chk"><input type="checkbox" name="fs"> Pagado con ahorros (se resta del saldo de ahorros)</label>`,d=>{S.trips.push({id:uid(),name:d.name,items:[],fromSavings:!!d.fs})});
  else if(a==='edittrip'){const x=S.trips.find(y=>y.id===id);const f=sheet(`<h3>Editar viaje</h3>${fld('Nombre',`<input name="name" required value="${esc(x.name)}">`)}<label class="chk"><input type="checkbox" name="fs" ${x.fromSavings?'checked':''}> Pagado con ahorros (se resta del saldo de ahorros)</label><div class="savonly">${fld('Monto restado de ahorros',`<input name="sa" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x.savAmt?nf(x.savAmt):''}" placeholder="${nf(tripTot(x))}">`,'Vacío = total del viaje.')}</div>`,d=>{x.name=d.name;x.fromSavings=!!d.fs;const v=num(d.sa);if(x.fromSavings&&v)x.savAmt=v;else delete x.savAmt},()=>{S.trips=S.trips.filter(y=>y!==x)});const sy=()=>f.querySelector('.savonly').style.display=f.fs.checked?'':'none';f.fs.onchange=sy;sy()}
  else if(a==='additem'||a==='edititem'){
    const tr=S.trips.find(y=>y.id===t.dataset.trip),it=a==='edititem'?tr.items.find(y=>y.id===id):null;
    const cur=it&&it.usd&&!it.ars?'USD':'ARS';
    const f=sheet(`<h3>${it?'Editar':'Nuevo'} gasto · ${esc(tr.name)}</h3>
      ${fld('Descripción',`<input name="desc" required value="${esc(it?.desc||'')}">`)}
      <div class="f2">${fld('Monto',`<input name="amt" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required value="${it?nf(cur==='USD'?it.usd:it.ars):''}" placeholder="0,00">`)}${fld('Moneda',curSeg(cur))}</div>
      <div class="usdonly">${fld('Cotización (queda fija)',`<input name="rate" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${nf(it?.rate||rate(curYM)||0)}">`,'Este valor no cambia aunque cambies el dólar del mes.')}</div>`,
      d=>{const v=num(d.amt),o=it||{id:uid()};Object.assign(o,{desc:d.desc,ars:d.cur==='USD'?0:v,usd:d.cur==='USD'?v:0,rate:d.cur==='USD'?num(d.rate):0});if(!it)tr.items.push(o)},
      it?()=>{tr.items=tr.items.filter(y=>y!==it)}:null);
    const sync=()=>f.querySelector('.usdonly').style.display=f.cur.value==='USD'?'':'none';
    f.querySelectorAll('[name=cur]').forEach(r=>r.onchange=sync);sync();
  }
  else if(a==='pal'){S.theme.p=id;save();applyTheme();render()}
  else if(a==='addcat')sheet(`<h3>Nueva categoría</h3>${fld('Nombre','<input name="name" required placeholder="Ej: SALIDAS">')}`,d=>{const n=normCat(d.name);if(S.cats.includes(n)){alert('Esa categoría ya existe.');return false}addCat(n)});
  else if(a==='delcat'){const c=S.cats[+id],n=S.purchases.filter(p=>p.cat===c).length;if(confirm(n?`"${c}" está en ${n} gastos. Esos gastos la conservan, pero no va a aparecer para elegir. ¿Borrarla?`:`¿Borrar "${c}"?`)){withUndo('Categoría borrada',()=>{S.cats.splice(+id,1)})}}
  else if(a==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='gastos-'+todayISO()+'.json';l.click()}
  else if(a==='chpass')showNewPass('',true);
  else if(a==='logout'){if(confirm('¿Cerrar sesión?')){sb.auth.signOut().then(()=>location.reload())}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('row'))e.target.click()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sim;if(k){SIM[k]=e.target.value;const r=$('#simres');if(r)r.innerHTML=simRes()}});
const isMoney=t=>t&&t.matches&&t.matches('input[data-money],input.amt');
document.addEventListener('change',e=>{const t=e.target;if(!isMoney(t))return;const v=t.value.trim().replace(/[$\s]/g,'');if(!isExpr(v))return;const r=calc(v);if(r!==null)t.value=(r<0?'-':'')+nf(r)},true);

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.mf){if(t.dataset.mf==='saving')setSaving(view,num(t.value));else S.months[view][t.dataset.mf]=num(t.value);save();render()}
  else if(t.dataset.pj){const m=t.dataset.m,v=num(t.value);if(t.dataset.pj==='sv')setSaving(m,v);else ensureMonth(m).salary=v;save();render()}
  else if('myname' in t.dataset){S.myName=t.value.trim();save();shLoad().then(()=>toast('Nombre actualizado'))}
  else if(t.dataset.ic){const x=S.months[view].incomes.find(y=>y.id===t.dataset.id);x[t.dataset.ic]=t.dataset.ic==='amount'?num(t.value):t.value;save();if(t.dataset.ic==='amount')render()}
  else if(t.dataset.tx){const x=S.months[view].taxes.find(y=>y.id===t.dataset.id);x[t.dataset.tx]=t.dataset.tx==='paid'?t.checked:t.dataset.tx==='amount'?num(t.value):t.value;save();if(t.dataset.tx!=='name')render()}
  else if(t.dataset.mode){S.theme.mode=t.dataset.mode;save();applyTheme()}
  else if(t.id==='imp'&&t.files[0]){t.files[0].text().then(s=>{try{const d=JSON.parse(s);if(!d.purchases||!d.months)throw 0;if(S.purchases.length&&!confirm('Esto reemplaza todos los datos actuales. ¿Seguir?'))return;S=d;S.theme=S.theme||{p:'rosa',mode:'auto'};migrate();save();applyTheme();render();alert('Importado: '+d.purchases.length+' gastos')}catch(err){alert('Archivo inválido')}})}
});
start();
</script>
</body>
