<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Gastos</title>
<meta name="theme-color" content="#fbf4f6">
<link rel="manifest" href="manifest.json">

<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--soft:#e6f4f1;--neg:#b91c1c;--pos:#15803d;--week:#f1f5f9;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#9aa1ac;--line:#2a2f38;--accent:#2dd4bf;--soft:#12332f;--neg:#f87171;--pos:#4ade80;--week:#20252d;--shadow:none}}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#9aa1ac;--line:#2a2f38;--accent:#2dd4bf;--soft:#12332f;--neg:#f87171;--pos:#4ade80;--week:#20252d;--shadow:none}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap;line-height:1.15}
@media(max-width:430px){.top .sync{display:block;margin:1px 0 0;font-size:10px}}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{min-width:128px;text-align:center;font-weight:600}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pad{padding:14px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:600}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
.kv:first-child{border-top:0}
.big{font-size:26px;font-weight:700;letter-spacing:-.01em}
.neg{color:var(--neg)}.pos{color:var(--pos)}.mut{color:var(--muted)}
.grid4{display:grid;gap:12px}
@media(min-width:900px){.grid4{grid-template-columns:1fr 1fr}.sumwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}}
.cc header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.cc header h3{flex:1;margin:0;font-size:14px;font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc)}
.cc.closed .rows{display:none}
.cc footer.ufoot{border-top:1px dashed var(--line)}
.chev{display:inline-block;color:var(--muted);font-size:12px;transition:transform .2s;width:14px;text-align:center}
.cc.closed .chev{transform:rotate(-90deg)}
.wk.cu{color:var(--ink)}
.wk{background:var(--week);font-size:12px;color:var(--muted);padding:5px 14px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer}
.wk+.row{border-top:0}
.row:hover{background:var(--soft)}
.dots{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:6px 4px;margin:-6px -6px -6px 0;border-radius:8px;cursor:pointer}
.dots:hover{background:var(--week)}.dots.has{color:var(--accent)}
.r-note{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink);background:var(--week);border-radius:6px;padding:3px 4px 3px 7px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.r-note span{flex:1}
.nx{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;cursor:pointer;border-radius:5px}.nx:hover{color:var(--neg);background:var(--card)}
.cdate{font-size:11px;color:var(--muted);font-weight:500;display:block;margin-top:1px}
.cc header .x{margin:-6px -8px -6px 0}
.addcard{width:100%;border:2px dashed var(--line);background:none;border-radius:14px;padding:14px;color:var(--accent);font-weight:650;cursor:pointer;margin-bottom:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches label{cursor:pointer}.swatches input{display:none}
.swatches i{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches input:checked+i{border-color:var(--ink)}
.r-desc{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
@media(min-width:900px){.r-desc{max-width:280px}}
.r-sub{font-size:12px;color:var(--muted)}
.r-cu{font-size:12px;color:var(--muted);background:var(--week);border-radius:6px;padding:2px 6px}
.r-amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-amt small{display:block;font-size:11px;color:var(--pos)}
.r-amt small.r-net{color:var(--muted)}
.cc footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px;border-top:1px solid var(--line);background:var(--week)}
.empty{padding:14px;color:var(--muted);font-size:13px}
.paid{border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 8px;cursor:pointer;white-space:nowrap;min-width:84px}
.paid.on{background:var(--accent);color:var(--onacc)}
.tax{display:grid;grid-template-columns:auto minmax(0,1fr) 100px auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.tax:first-child{border-top:0}
.tax.inc{grid-template-columns:minmax(0,1fr) auto 110px auto}
.incref{border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;font-size:10.5px;font-weight:700;padding:4px 8px;cursor:pointer;white-space:nowrap}.incref.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.refbal{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--week)}.refbal span{display:flex;flex-direction:column;font-weight:600;font-size:13px}.refbal small{font-weight:400;color:var(--muted);font-size:11.5px}
.tax input[type=text]{border:1px solid transparent;background:none;border-radius:7px;padding:6px;width:100%}
.tax input[type=text]:focus{border-color:var(--line);background:var(--bg)}
.tax input.amt{text-align:right}
.txn{min-width:0;display:flex;flex-direction:column}.tax .txcat{grid-column:2/-1;grid-row:2;justify-self:start;margin-top:-6px}.txcat{position:relative;align-self:flex-start;display:inline-flex;max-width:100%;margin:2px 0 0 4px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid transparent;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;cursor:pointer}.txcat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txcat.e{background:none;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--muted);font-weight:400}.txcat select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}.txcat option{background:var(--card);color:var(--ink)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:10px 14px}
.bar{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
.li:hover{background:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;text-align:right;padding:8px 10px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.c{cursor:pointer}.tbl tr.c:hover{background:var(--soft)}
.tbl tfoot td{font-weight:700;background:var(--week)}
.warn{font-size:11px;color:var(--neg)}
.mob{display:none}
@media(max-width:600px){.tbl th:nth-child(2),.tbl th:nth-child(3),.tbl td:nth-child(2),.tbl td:nth-child(3){display:none}.mob{display:block}.tbl td{padding:10px 14px}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent);font-weight:650}
.nav span{display:block;font-size:19px;line-height:1.2}

@media(max-width:700px){.nav .nmore{display:none}}
.moremenu{position:fixed;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:21;background:var(--card);border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.moremenu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 12px;border-radius:9px;font-size:15px;cursor:pointer;text-align:left}
.moremenu button:hover,.moremenu button.on{background:var(--week);color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--onacc);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .fld{margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:9px 0;cursor:pointer;font-size:14px}
.seg input{display:none}
.seg input:checked+span{color:var(--accent);font-weight:700}
.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:11px;padding:12px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--onacc)}
.btn.sec{background:var(--week);color:var(--ink)}
.btn.del{background:none;color:var(--neg);flex:0 0 auto;padding:12px 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 10px}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.pal{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 4px;cursor:pointer;font-size:11px;text-align:center}
.pal.on{border-color:var(--accent)}
.pal i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
@media(max-width:700px){.simt{font-size:13px}}

.tgl{cursor:pointer;user-select:none}
.acwrap{position:relative}.acl{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;background:var(--card);border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}.acl button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;padding:8px 11px;text-align:left;cursor:pointer;border-top:1px solid var(--line)}.acl button:first-child{border-top:0}.acl button span{font-size:12px;color:var(--muted)}.acl button:hover,.acl button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}#achint{color:var(--accent)}
.lbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 14px 4px}.lbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.loan{margin-bottom:10px}.loan .kv{padding:6px 14px}.loan .lnk{padding:8px 14px 12px}.lnbtns{display:flex;justify-content:space-between;flex-wrap:wrap}.lnpay{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}.loan.done .lbar i{background:var(--pos)}
.simt{display:grid;grid-template-columns:1.2fr 1fr 1fr;margin-top:12px}.simt>div{padding:8px 4px;border-top:1px solid var(--line)}.simt>div:nth-child(3n+2),.simt>div:nth-child(3n){text-align:right}.simt .h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.hero{background:var(--soft);border:2px solid color-mix(in srgb,var(--accent) 75%,var(--line))}
.srchbar{display:flex;align-items:center;gap:8px;flex:1;max-width:340px;border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14.5px;text-align:left}
.srchbar svg{color:var(--accent);flex:none}
.srchbar:hover{border-color:var(--accent);color:var(--ink)}
.srchb{display:none;border:0;background:none;color:var(--accent);padding:6px;margin:-6px 0 -6px 6px;border-radius:10px;cursor:pointer;vertical-align:-5px}
.srchb:hover{background:var(--soft)}
.srchbar{margin-left:20px}.mnav{margin-left:auto}
.top.nosrch .srchb,.top.nosrch .srchbar{display:none!important}
@media(max-width:700px){.srchb{display:inline-block}.srchbar{display:none}.top h1{flex:1;min-width:0}.top .sync{overflow:hidden;text-overflow:ellipsis}}
.srch{align-self:flex-start;border-radius:0 0 18px 18px;max-height:85vh;display:flex;flex-direction:column;gap:10px;padding-top:calc(14px + env(safe-area-inset-top))}
.srch .sbox{display:flex;align-items:center;gap:8px;border:2px solid var(--accent);border-radius:12px;padding:8px 10px;background:var(--bg)}
.srch .sbox input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.srch .sbox button{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px}

.srch .stot b{color:var(--ink)}

.srch .sres .row{grid-template-columns:1fr auto}
.srch .sres .row:first-child{border-top:0}

@media(min-width:700px){.srch{align-self:flex-start;margin-top:60px;border-radius:18px}}
.aviso{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--cc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 35%,var(--line));border-radius:12px;padding:8px 4px 8px 12px;margin-bottom:10px}

.aviso div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px;line-height:1.3}
.aviso div span{color:var(--muted);font-size:12.5px}

.aviso .ax:hover{background:var(--week)}
.fjrow{grid-template-columns:1fr auto auto;cursor:default}.fjrow:hover{background:none}
.fjp{display:inline-block;font-size:11px;font-weight:650;border-radius:999px;padding:1px 7px;margin-left:4px;background:var(--soft);color:var(--accent);vertical-align:1px}
.fjp.up{background:color-mix(in srgb,var(--neg) 14%,var(--card));color:var(--neg)}.fjp.new{background:var(--week);color:var(--muted)}
.fjx{border:0;background:none;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}.fjx:hover{color:var(--neg);background:var(--week)}
.fjb{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}.fjb.on{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:650}
.fjtog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;cursor:pointer}.fjtog input{position:absolute;opacity:0;pointer-events:none}

.fjtog input:checked+span{border-color:var(--accent);background:var(--soft);color:var(--accent)}.fjtog input:focus-visible+span{outline:2px solid var(--accent)}

.fjrowf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}.fjrowf .fjtog{margin:0}
.fjsel{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:13.5px}
.tsum{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.tbar{height:10px;border-radius:6px;background:var(--week);overflow:hidden;margin-bottom:6px}.tbar i{display:block;height:100%;background:var(--accent);border-radius:6px}.tbar.over i{background:var(--neg)}
.tline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}.tline b{color:var(--ink)}
.tsum .kv{font-size:13.5px;font-variant-numeric:tabular-nums}
.tbar.sm{height:6px;margin:2px 0 6px}.trbs{padding-top:8px}.trb .tline{margin-bottom:0}
.trubs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 6px}.trubs span{font-size:12px;background:var(--week);border-radius:999px;padding:3px 9px;color:var(--muted)}.trubs b{color:var(--ink);font-weight:600}

async function push(){

  const {error}=await sb.from('app_state').upsert({user_id:user.id,data:S,updated_at:at});
  if(error){setSync(navigator.onLine?'no se pudo guardar · reintentando':'sin conexión · guardado en el celular');console.warn(error);return}

async function pull(force){

  if(error)throw error;
  if(data&&(force||!remoteAt||data.updated_at>remoteAt)){S=data.data;remoteAt=data.updated_at;cache();return true}
  return false;
}

function ensureMonth(m){

  const prev=Object.keys(S.months).filter(k=>k<m).sort().pop();
  const p=prev?S.months[prev]:{usd:0,salary:0,taxes:[]};
  S.months[m]={usd:p.usd,salary:p.salary,taxes:p.taxes.map(t=>({...t,id:uid(),paid:false}))};
  save();return S.months[m];
}
const lastMonth=m=>{const k=Object.keys(S.months).filter(x=>x<=m&&S.months[x]).sort().pop();return k?S.months[k]:{usd:0,salary:0,taxes:[]}};
const rate=m=>(S.months[m]&&S.months[m].usd)||(lastMonth(m).usd||0);

const savingOf=m=>{const d=plainDep(m);return d?+d.amount:0};

function tcTotal(cs,M){const ars=cs.reduce((s,x)=>s+x.n,0),un=cs.reduce((s,x)=>s+x.un,0);return ars+Math.max(0,un-num(M.usdPaid||0))*(num(M.usd)||0)}

/* saldo de reintegros: lo reintegrado en tarjetas (sin la parte compartida) desde S.refStart, menos los ingresos marcados ↩ */
function refAvail(m){if(!S.refStart||m<S.refStart)return null;let t=0;for(let k=S.refStart;k<=m;k=addM(k,1)){for(const c of cardsAll()){const x=cardTot(c,k);t+=x.rf+x.urf*rate(k)}t-=((S.months[k]||{}).incomes||[]).filter(i=>i.ref).reduce((s,i)=>s+Math.abs(num(i.amount)),0)}return Math.round(t*100)/100}

function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

const CATPAL={l:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#0891b2','#84cc16','#c026d3','#a16207','#0f766e','#f43f5e','#6366f1','#ca8a04','#7c3aed','#b91c1c','#0369a1','#65a30d'],d:['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767','#22d3ee','#a3e635','#e879f9','#d4a056','#2dd4bf','#fb7185','#818cf8','#facc15','#c084fc','#f87171','#38bdf8','#86efac']};
let DON=[];
function catSlot(c){S.catSlots=S.catSlots||{};const m=S.catSlots;
  for(const k of Object.keys(m))if(!S.cats.includes(k))delete m[k];
  if(c in m)return m[c];if(!S.cats.includes(c))return -1;
  for(const k of S.cats){if(k in m)continue;const used=new Set(Object.values(m));let f=0;while(used.has(f))f++;if(f>=20)break;m[k]=f;if(k===c)break}
  return c in m?m[c]:-1}
function donutHTML(cat){
  const dark=!!window.__dark;
  const pal=CATPAL[dark?'d':'l'],other={k:'OTROS',v:0,c:'var(--muted)'};
  let seg=[];
  for(const[k,v]of Object.entries(cat)){if(v<=0)continue;const i=catSlot(k);if(i>=0)seg.push({k,v,c:pal[i],i:S.cats.indexOf(k)});else other.v+=v}
  seg.sort((a,b)=>a.i-b.i);if(other.v>0)seg.push(other);
  const tot=seg.reduce((s,x)=>s+x.v,0);if(!tot)return '<div class="mut">Sin gastos.</div>';
  const R=90,r0=58,cx=95,cy=95;let a0=-Math.PI/2;
  const pt=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)].map(n=>n.toFixed(2)).join(' ');
  DON=seg.map(x=>({...x,p:x.v/tot}));
  const paths=DON.map((x,j)=>{const a1=a0+x.p*Math.PI*2-(x.p===1?1e-4:0),lg=(a1-a0)>Math.PI?1:0;
    const d=`M${pt(a0,R)} A${R} ${R} 0 ${lg} 1 ${pt(a1,R)} L${pt(a1,r0)} A${r0} ${r0} 0 ${lg} 0 ${pt(a0,r0)}Z`;a0=a1;
    return `<path d="${d}" fill="${x.c}" data-dj="${j}"></path>`}).join('');
  return `<div class="donut" id="donut"><svg viewBox="0 0 190 190" role="img" aria-label="Gastos por categoría">${paths}
    <text x="95" y="80" text-anchor="middle" class="dc1" id="dc1">Total</text><text x="95" y="101" text-anchor="middle" class="dc2" id="dc2">${fmt(tot)}</text><text x="95" y="118" text-anchor="middle" class="dc3" id="dc3">${DON.length} categorías</text></svg>
    <div class="dleg">${DON.map((x,j)=>`<button data-dj="${j}"><i style="background:${x.c}"></i><span>${esc(x.k)}</span><b>${fmt(x.v)}</b><span class="pc">${(x.p*100).toFixed(0)}%</span></button>`).join('')}</div><div class="dtip" id="dtip"></div></div>`;
}
function donutHL(j,ev){
  const w=$('#donut');if(!w)return;const x=DON[j];
  w.classList.toggle('hl',j!=null);w.querySelectorAll('[data-dj]').forEach(e=>e.classList.toggle('on',+e.dataset.dj===j));
  $('#dc1').textContent=x?x.k:'Total';$('#dc2').textContent=fmt(x?x.v:DON.reduce((s,y)=>s+y.v,0));$('#dc3').textContent=x?(x.p*100).toFixed(1)+'% del mes':DON.length+' categorías';
  const t=$('#dtip');if(x&&ev&&ev.target.tagName==='path'){const b=w.getBoundingClientRect();t.style.left=(ev.clientX-b.left)+'px';t.style.top=(ev.clientY-b.top)+'px';t.innerHTML=`<b>${esc(x.k)}</b> · ${fmt(x.v)} · ${(x.p*100).toFixed(1)}%`;t.classList.add('on')}else t.classList.remove('on');
}
document.addEventListener('pointermove',e=>{const d=e.target.closest&&e.target.closest('#donut [data-dj]');if(d)donutHL(+d.dataset.dj,e);else if($('#donut')?.classList.contains('hl')&&!e.target.closest?.('#donut'))donutHL(null)});
document.addEventListener('pointerleave',()=>donutHL(null));
document.addEventListener('click',e=>{const d=e.target.closest&&e.target.closest('#donut [data-dj]');if(d){const j=+d.dataset.dj;donutHL(d.classList.contains('on')&&e.pointerType!=='mouse'?null:j,e)}});

const SH={loaded:false,all:[],ledger:null,members:[],entries:[],loans:[],chan:null,err:''};
const shOther=()=>SH.members.find(m=>m.user_id!==user?.id);
const shName=id=>id===user?.id?'Vos':((SH.members.find(m=>m.user_id===id)||{}).name||'La otra persona');
const shOtherName=()=>shOther()?.name||'la otra persona';
const shOtherOf=L=>(L.members.find(m=>m.user_id!==user?.id)||{}).name;
function shMonthsOf(e){const out=[];for(let i=0;i<e.cuotas;i++)out.push(addM(e.first_month,i));return out}
function shSigned(e){const v=+e.cuota*(e.kind==='pago'?1:+e.share);return e.paid_by===user?.id?v:-v}
function shBalance(upTo,entries=SH.entries){let b=0,fut=0;for(const e of entries)for(const m of shMonthsOf(e)){const v=shSigned(e);if(m<=upTo)b+=v;else fut+=v}return{b,fut}}
const isU=e=>e.cur==='USD';
function shMonthNet(m,entries=SH.entries,cur='ARS'){let t=0;for(const e of entries)if((e.cur||'ARS')===cur&&shMonthsOf(e).includes(m))t+=shSigned(e);return t}
const shPending=()=>SH.all.flatMap(L=>L.entries.filter(e=>e.kind==='gasto'&&e.paid_by===user?.id&&e.created_by&&e.created_by!==user?.id&&!e.source_purchase&&!(S.shIgn||[]).includes(e.id)).map(e=>({L,e})));
function shOweMonth(m){let t=0;for(const L of SH.all)for(const e of L.entries)if(e.kind==='gasto'&&e.paid_by!==user?.id&&shMonthsOf(e).includes(m))t+=+e.cuota*+e.share*(isU(e)?rate(m):1);return Math.round(t*100)/100}
function shSelect(id){const L=SH.all.find(x=>x.ledger.id===id)||SH.all[0];if(!L){SH.ledger=null;SH.members=[];SH.entries=[];SH.loans=[];return}
  SH.ledger=L.ledger;SH.members=L.members;SH.entries=L.entries;SH.loans=L.loans||[];if(S.shCur!==L.ledger.id){S.shCur=L.ledger.id;cache()}}
async function shLoad(){
  if(!sb||!user)return;
  try{
    const {data:mem,error:e1}=await sb.from('ledger_members').select('ledger_id').eq('user_id',user.id);
    if(e1)throw e1;
    const ids=[...new Set((mem||[]).map(m=>m.ledger_id))];
    if(!ids.length){SH.all=[];shSelect(null);SH.loaded=true;return}
    const [{data:lgs},{data:ms},{data:es},{data:lns}]=await Promise.all([
      sb.from('ledgers').select('*').in('id',ids),
      sb.from('ledger_members').select('*').in('ledger_id',ids),
      sb.from('ledger_entries').select('*').in('ledger_id',ids).order('first_month'),
      sb.from('ledger_loans').select('*').in('ledger_id',ids).order('date')]);
    SH.all=(lgs||[]).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).map(l=>({ledger:l,members:(ms||[]).filter(m=>m.ledger_id===l.id),entries:(es||[]).filter(e=>e.ledger_id===l.id),loans:(lns||[]).filter(e=>e.ledger_id===l.id)}));
    shSelect(S.shCur);SH.loaded=true;SH.err='';SH.off=false;
    try{localStorage.setItem('gastos-sh-'+user.id,JSON.stringify(SH.all))}catch(e){}
    let ch=false;const byE={};SH.all.forEach(L=>L.entries.forEach(e=>byE[e.id]=[L,e]));
    for(const L of SH.all)for(const e of L.entries){if(!e.source_purchase||e.paid_by!==user.id)continue;const p=S.purchases.find(x=>x.id===e.source_purchase);if(p&&!p.shared){p.shared={l:L.ledger.id,e:e.id,s:+e.share,w:shOtherOf(L)||'',from:e.first_month};ch=true}}
    for(const p of S.purchases){if(!p.shared||!p.shared.e)continue;const hit=byE[p.shared.e];
      if(!hit){delete p.shared;ch=true}
      else{const [L,e]=hit,w=shOtherOf(L)||'';if(p.shared.s!==+e.share||p.shared.w!==w||p.shared.from!==e.first_month){p.shared.s=+e.share;p.shared.w=w;p.shared.from=e.first_month;ch=true}}}
    if(ch){save();if(tab==='mes')render()}
    const myName=(S.myName||'').trim();
    if(myName)for(const L of SH.all){const me=L.members.find(m=>m.user_id===user.id);if(me&&me.name!==myName){me.name=myName;sb.from('ledger_members').update({name:myName}).eq('ledger_id',L.ledger.id).eq('user_id',user.id).then(()=>{})}}
    if(!SH.chan&&sb.channel){SH.chan=sb.channel('ledgers-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'ledger_entries'},()=>shRefresh())
      .on('postgres_changes',{event:'*',schema:'public',table:'ledger_members'},()=>shRefresh())
      .on('postgres_changes',{event:'*',schema:'public',table:'ledger_loans'},()=>shRefresh())
      .subscribe()}

function freqList(){const lim=addM(curYM,-6),cnt=new Map(),last=new Map();
  for(const p of S.purchases){const k=(p.desc||'').trim().toUpperCase();if(!k||p.rec||p.until||!p.date||p.date.slice(0,7)<lim)continue;cnt.set(k,(cnt.get(k)||0)+1);const o=last.get(k);if(!o||p.date>=o.date)last.set(k,p)}
  return [...cnt].filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>last.get(k))}
function acHist(){const seen=new Map();for(let i=S.purchases.length-1;i>=0;i--){const p=S.purchases[i],k=(p.desc||'').trim().toUpperCase();if(!k)continue;const old=seen.get(k);if(!old||(p.date||'')>(old.date||''))seen.set(k,p)}return [...seen.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function acWire(f,resync,psUI){
  const H=acHist(),box=$('#acl'),hint=$('#achint');let items=[],sel=-1;
  const apply=p=>{f.desc.value=p.desc;const c=cardById(p.card);if(c&&!c.hidden){f.card.value=p.card}
    if([...f.cat.options].some(o=>o.value===p.cat||o.textContent===p.cat))f.cat.value=p.cat;
    const cr=f.querySelector(`[name=cur][value="${p.cur||'ARS'}"]`);if(cr)cr.checked=true;
    if(f.toshared){f.toshared.checked=!!p.shared;f.toshared.dispatchEvent(new Event('change'));
      if(p.shared&&f.psmode){const s=+p.shared.s;f.psmode.value=s===.5?'50':s===1?'100':'pct';if(f.psmode.value==='pct')f.psval.value=String(Math.round(s*1000)/10).replace('.',',');f.psmode.onchange&&f.psmode.onchange()}}
    resync();if(p.shared||p.cur==='USD'){const m=$('#more');if(m)m.open=true}hint.textContent=`Como la última vez: ${cardById(p.card)?.name||p.card} · ${p.cat}${p.shared?' · compartido':''}`;close()};
  const close=()=>{box.innerHTML='';box.style.display='none';items=[];sel=-1};
  const show=()=>{const q=f.desc.value.trim().toUpperCase();hint.textContent='';if(q.length<2){close();return}
    items=H.filter(p=>p.desc.toUpperCase().includes(q)).sort((a,b)=>(b.desc.toUpperCase().startsWith(q))-(a.desc.toUpperCase().startsWith(q))).slice(0,6);
    if(!items.length||(items.length===1&&items[0].desc.toUpperCase()===q&&hint.textContent)){close();return}
    box.innerHTML=items.map((p,i)=>`<button type="button" data-i="${i}" class="${i===sel?'on':''}"><b>${esc(p.desc)}</b><span>${esc(cardById(p.card)?.name||p.card)} · ${esc(p.cat||'')}${p.shared?' · ⇄':''}</span></button>`).join('');box.style.display='block'};
  f.desc.addEventListener('input',()=>{sel=-1;show()});
  f.desc.addEventListener('keydown',e=>{if(!items.length)return;if(e.key==='ArrowDown'){sel=(sel+1)%items.length;show();e.preventDefault()}else if(e.key==='ArrowUp'){sel=(sel-1+items.length)%items.length;show();e.preventDefault()}else if(e.key==='Enter'&&sel>=0){apply(items[sel]);e.preventDefault()}else if(e.key==='Escape')close()});
  box.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();apply(items[+b.dataset.i])});
  f.desc.addEventListener('blur',()=>setTimeout(()=>{if(!box.matches(':hover'))close()},150));
  f.desc.addEventListener('change',()=>{const q=f.desc.value.trim().toUpperCase(),m=H.find(p=>p.desc.trim().toUpperCase()===q);if(m&&!hint.textContent)apply(m)});
  return apply;
}

  else if(a==='adddep')simpleForm('Nuevo ahorro',[['month','Mes','month',curYM],['amount','Monto','num'],['note','Nota']],null,d=>{S.deposits.push({id:uid(),month:d.month,amount:num(d.amount),note:d.note})});
  else if(a==='editdep'){const x=S.deposits.find(y=>y.id===id);simpleForm('Editar ahorro',[['month','Mes','month',x.month],['amount','Monto','num',nf(x.amount)],['note','Nota','',x.note]],x,d=>{Object.assign(x,{month:d.month,amount:num(d.amount),note:d.note})},()=>{S.deposits=S.deposits.filter(y=>y!==x)})}
  else if(a==='realbal'){const app=savBal();const f=sheet(`<h3>Actualizar saldo real</h3><div class="hint" style="margin:-6px 0 10px">Poné lo que te muestra el banco hoy. La diferencia con la app se anota como rendimientos.</div>
    ${fld('Saldo real','<input name="real" inputmode="text" data-money autocomplete="off" required placeholder="0,00">')}${fld('Fecha',`<input type="date" name="date" value="${todayISO()}">`)}
    <div class="kv"><span>La app calcula</span><b>${fmt(app)}</b></div><div class="kv"><span>Rendimiento</span><b id="ydiff">—</b></div>`,
    d=>{const v=num(d.real),df=Math.round((v-app)*100)/100;if(!v){alert('Falta el saldo');return false}if(Math.abs(df)<0.005){toast('Ya coincide con el banco');return}
      (S.yields=S.yields||[]).push({id:uid(),date:d.date||todayISO(),amount:df});toast('Rendimiento anotado: '+fmt(df))});
    f.real.addEventListener('input',()=>{const v=num(f.real.value),df=v-app;$('#ydiff').textContent=v?fmt(df):'—';$('#ydiff').className=v?(df<0?'neg':'pos'):''})}
  else if(a==='edityld'){const x=S.yields.find(y=>y.id===id);simpleForm('Rendimientos FCI',[['date','Fecha','date',x.date],['amount','Monto','num',(x.amount<0?'-':'')+nf(x.amount)]],x,d=>{Object.assign(x,{date:d.date,amount:num(d.amount)})},()=>{S.yields=S.yields.filter(y=>y!==x)})}
  else if(a==='addsx')simpleForm('Gasto desde ahorros',[['desc','Descripción'],['date','Fecha','date',todayISO()],['amount','Monto','num']],null,d=>{S.savingsExp.push({id:uid(),desc:d.desc,date:d.date,amount:num(d.amount)})});
  else if(a==='editsx'){const x=S.savingsExp.find(y=>y.id===id);simpleForm('Editar gasto desde ahorros',[['desc','Descripción','',x.desc],['date','Fecha','date',x.date],['amount','Monto','num',nf(x.amount)]],x,d=>{Object.assign(x,{desc:d.desc,date:d.date,amount:num(d.amount)})},()=>{S.savingsExp=S.savingsExp.filter(y=>y!==x)})}
  else if(a==='addtrip'){const x=null;sheet(`<h3>Nuevo viaje</h3>${fld('Nombre','<input name="name" required>')}<div class="f2">${fld('Desde',`<input type="date" name="start" value="${x?.start||''}">`)}${fld('Hasta',`<input type="date" name="end" value="${x?.end||''}">`)}</div>${fld('Presupuesto ($)',`<input name="budget" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x?.budget?nf(x.budget):''}" placeholder="Opcional">`,'Si lo dejás vacío, se usa la suma de los rubros.')}<details class="more" ${x&&x.rb&&Object.keys(x.rb).length?'open':''}><summary>Presupuesto por rubro</summary>${RUBROS.map(r=>fld(r+(RUBHINT[r]?` <span class="mut">· ${RUBHINT[r]}</span>`:''),`<input name="rb_${r}" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x?.rb?.[r]?nf(x.rb[r]):''}" placeholder="Opcional">`)).join('')}</details>${covPick(S.trips.length%TRIPC.length)}<label class="chk"><input type="checkbox" name="fs"> Pagado con ahorros (se resta del saldo de ahorros)</label>`,d=>{const o={id:uid(),name:d.name,items:[],fromSavings:!!d.fs,rubDone:true,color:d.col!=null?+d.col:S.trips.length%TRIPC.length};tripDates(o,d);S.trips.push(o);tripOpen=o.id})}
  else if(a==='edittrip'){const x=S.trips.find(y=>y.id===id);const f=sheet(`<h3>Editar viaje</h3>${fld('Nombre',`<input name="name" required value="${esc(x.name)}">`)}<div class="f2">${fld('Desde',`<input type="date" name="start" value="${x?.start||''}">`)}${fld('Hasta',`<input type="date" name="end" value="${x?.end||''}">`)}</div>${fld('Presupuesto ($)',`<input name="budget" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x?.budget?nf(x.budget):''}" placeholder="Opcional">`,'Si lo dejás vacío, se usa la suma de los rubros.')}<details class="more" ${x&&x.rb&&Object.keys(x.rb).length?'open':''}><summary>Presupuesto por rubro</summary>${RUBROS.map(r=>fld(r+(RUBHINT[r]?` <span class="mut">· ${RUBHINT[r]}</span>`:''),`<input name="rb_${r}" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x?.rb?.[r]?nf(x.rb[r]):''}" placeholder="Opcional">`)).join('')}</details>${covPick(tripIdx(x))}<label class="chk"><input type="checkbox" name="fs" ${x.fromSavings?'checked':''}> Pagado con ahorros (se resta del saldo de ahorros)</label><div class="savonly">${fld('Monto restado de ahorros',`<input name="sa" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${x.savAmt?nf(x.savAmt):''}" placeholder="${nf(tripTot(x))}">`,'Vacío = total del viaje.')}</div>`,d=>{x.name=d.name;x.fromSavings=!!d.fs;if(d.col!=null)x.color=+d.col;tripDates(x,d);const v=num(d.sa);if(x.fromSavings&&v)x.savAmt=v;else delete x.savAmt},()=>{S.trips=S.trips.filter(y=>y!==x)});const sy=()=>f.querySelector('.savonly').style.display=f.fs.checked?'':'none';f.fs.onchange=sy;sy()}
  else if(a==='additem'||a==='edititem'){
    const tr=S.trips.find(y=>y.id===t.dataset.trip),it=a==='edititem'?tr.items.find(y=>y.id===id):null;
    const cur=it&&it.usd&&!it.ars?'USD':'ARS';
    const f=sheet(`<h3>${it?'Editar':'Nuevo'} gasto · ${esc(tr.name)}</h3>
      ${fld('Descripción',`<input name="desc" required value="${esc(it?.desc||'')}">`)}
      <div class="f2">${fld('Monto',`<input name="amt" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required value="${it?nf(cur==='USD'?it.usd:it.ars):''}" placeholder="0,00">`)}${fld('Moneda',curSeg(cur))}</div>
      ${fld('Rubro',`<select name="rub"><option value="">Sin rubro</option>${RUBROS.map(r=>`<option value="${r}" ${(it&&it.rub?rubOf(it):'')===r?'selected':''}>${r}${RUBHINT[r]?' ('+RUBHINT[r]+')':''}</option>`).join('')}</select>`,'Opcional. Solo para ver en qué se va el viaje.')}
      <div class="usdonly">${fld('Cotización (queda fija)',`<input name="rate" inputmode="text" data-money autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${nf(it?.rate||rate(curYM)||0)}">`,'Este valor no cambia aunque cambies el dólar del mes.')}</div>`,
      d=>{const v=num(d.amt),o=it||{id:uid()};Object.assign(o,{desc:d.desc,ars:d.cur==='USD'?0:v,usd:d.cur==='USD'?v:0,rate:d.cur==='USD'?num(d.rate):0});if(d.rub)o.rub=d.rub;else delete o.rub;if(!it)tr.items.push(o)},
      it?()=>{tr.items=tr.items.filter(y=>y!==it)}:null);
    const sync=()=>f.querySelector('.usdonly').style.display=f.cur.value==='USD'?'':'none';
    f.querySelectorAll('[name=cur]').forEach(r=>r.onchange=sync);sync();
    if(!it){let tch=false;f.rub.onchange=()=>tch=true;f.desc.oninput=()=>{if(!tch)f.rub.value=rubSug(f.desc.value)}}
  }
  else if(a==='pal'){S.theme.p=id;save();applyTheme();render()}
  else if(a==='addcat')sheet(`<h3>Nueva categoría</h3>${fld('Nombre','<input name="name" required placeholder="Ej: SALIDAS">')}`,d=>{const n=normCat(d.name);if(S.cats.includes(n)){alert('Esa categoría ya existe.');return false}addCat(n)});
  else if(a==='delcat'){const c=S.cats[+id],n=S.purchases.filter(p=>p.cat===c).length;if(confirm(n?`"${c}" está en ${n} gastos. Esos gastos la conservan, pero no va a aparecer para elegir. ¿Borrarla?`:`¿Borrar "${c}"?`)){withUndo('Categoría borrada',()=>{S.cats.splice(+id,1)})}}
  else if(a==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='gastos-'+todayISO()+'.json';l.click()}
  else if(a==='chpass')showNewPass('',true);
  else if(a==='logout'){if(confirm('¿Cerrar sesión?')){sb.auth.signOut().then(()=>location.reload())}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('row'))e.target.click()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sim;if(k){SIM[k]=e.target.value;const r=$('#simres');if(r)r.innerHTML=simRes()}});
const isMoney=t=>t&&t.matches&&t.matches('input[data-money],input.amt');
document.addEventListener('change',e=>{const t=e.target;if(!isMoney(t))return;const v=t.value.trim().replace(/[$\s]/g,'');if(!isExpr(v))return;const r=calc(v);if(r!==null)t.value=(r<0?'-':'')+nf(r)},true);

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.mf){if(t.dataset.mf==='saving')setSaving(view,num(t.value));else S.months[view][t.dataset.mf]=num(t.value);save();render()}
  else if(t.dataset.pj){const m=t.dataset.m,v=num(t.value);if(t.dataset.pj==='sv')setSaving(m,v);else ensureMonth(m).salary=v;save();render()}
  else if('myname' in t.dataset){S.myName=t.value.trim();save();shLoad().then(()=>toast('Nombre actualizado'))}
  else if(t.dataset.ic){const x=S.months[view].incomes.find(y=>y.id===t.dataset.id);x[t.dataset.ic]=t.dataset.ic==='amount'?num(t.value):t.value;save();if(t.dataset.ic==='amount')render()}
  else if(t.dataset.tx){const x=S.months[view].taxes.find(y=>y.id===t.dataset.id);x[t.dataset.tx]=t.dataset.tx==='paid'?t.checked:t.dataset.tx==='amount'?num(t.value):t.value;if(t.dataset.tx==='cat'){const nm=(x.name||'').trim().toLowerCase();if(nm)for(const[k,M2]of Object.entries(S.months))if(k>view)(M2.taxes||[]).forEach(y=>{if((y.name||'').trim().toLowerCase()===nm&&!y.cat)y.cat=t.value})}save();if(t.dataset.tx!=='name')render()}
  else if(t.dataset.mode){S.theme.mode=t.dataset.mode;save();applyTheme()}
  else if(t.id==='imp'&&t.files[0]){t.files[0].text().then(s=>{try{const d=JSON.parse(s);if(!d.purchases||!d.months)throw 0;if(S.purchases.length&&!confirm('Esto reemplaza todos los datos actuales. ¿Seguir?'))return;S=d;S.theme=S.theme||{p:'rosa',mode:'auto'};migrate();save();applyTheme();render();alert('Importado: '+d.purchases.length+' gastos')}catch(err){alert('Archivo inválido')}})}
});
start();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
